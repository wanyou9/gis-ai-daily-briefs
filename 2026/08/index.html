<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d5e">
  <meta name="description" content="GIS-AI 期刊每日轮检简报 2026 年 8 月索引。">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <title>2026 年 8 月｜GIS-AI 期刊每日轮检简报</title>
  <style>
    :root { --ink:#17343a; --muted:#5d7175; --paper:#f5f7f3; --card:#fff; --brand:#0b5d5e; --accent:#d78a3a; --line:#dbe4df; --soft:#e5f1ed; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; line-height:1.65; }
    a { color:var(--brand); text-underline-offset:.2em; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:.2rem; }
    .shell { width:min(64rem,calc(100% - 2rem)); margin-inline:auto; }
    .crumbs { padding:1rem 0; color:var(--muted); font-size:.9rem; }
    header { padding:clamp(1.6rem,5vw,3.5rem); color:#fff; background:linear-gradient(135deg,#073f40,var(--brand)); border-radius:1.35rem; }
    .eyebrow { margin:0 0 .4rem; color:#bfe6dc; font-weight:800; letter-spacing:.1em; }
    h1 { margin:0; font-size:clamp(2rem,6vw,4rem); line-height:1.1; }
    header p:last-child { max-width:42rem; margin:1rem 0 0; color:#dcefeb; }
    main { padding:1.5rem 0 3rem; }
    h2 { margin:0 0 .75rem; font-size:1.25rem; }
    .notice { padding:1.3rem; background:var(--card); border:1px solid var(--line); border-radius:1rem; box-shadow:0 8px 25px rgba(19,52,58,.045); }
    .status { display:inline-flex; align-items:center; gap:.5rem; padding:.3rem .65rem; color:var(--brand); background:var(--soft); border-radius:999px; font-size:.85rem; font-weight:800; }
    .notice p:last-child { margin-bottom:0; color:var(--muted); }
    footer { padding:1.5rem 0 2.5rem; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem; }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="crumbs" aria-label="面包屑"><a href="../../">首页</a> / <a href="../">2026</a> / <span aria-current="page">08</span></nav>
    <header>
      <p class="eyebrow">MONTH ARCHIVE</p>
      <h1>2026 年 8 月</h1>
      <p>本月从第 1 组开始新的 30 组月度轮次。日报将在每天凌晨 2 点任务成功提交后出现在这里。</p>
    </header>
    <main>
      <section aria-labelledby="daily-title">
        <h2 id="daily-title">每日简报</h2>
        <div class="notice">
          <div class="status">等待首份日报</div>
          <p>2026 年 8 月 1 日任务完成后，本页将显示日报标题、常规组、补扫任务、批次状态与关键计数。</p>
        </div>
      </section>
    </main>
    <footer><p><a href="../">返回 2026 年索引</a> · <a href="../../">返回站点首页</a></p></footer>
  </div>
</body>
</html>
